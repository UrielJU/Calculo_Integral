<head>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=JetBrains+Mono:wght@300;400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
  <a href="#page-main" class="skip-link">Saltar al contenido</a>
  <nav>
    <a href="portada.html" class="nav-brand">∫ CálculoIntegral</a>
    <ul class="nav-links">
      <li><a href="portada.html">Portada</a></li>
      <li><a href="introduccion.html">Intro</a></li>
      <li><a href="definiciones.html">Definiciones</a></li>
      <li><a href="riemann.html">Riemann</a></li>
      <li><a href="metodos.html">Métodos</a></li>
      <li><a href="simulador.html">Simulador</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="referencias.html">Referencias</a></li>
    </ul>
    <button class="nav-toggle" aria-controls="main-nav" aria-expanded="false" onclick="toggleNav()" aria-label="Abrir menú">☰</button>
    <button class="btn-darkmode" onclick="toggleMode()">☀ / ☾</button>
  </nav>

  <main id="page-main">
    <section id="quiz">
      <div class="section-header">
        <span class="section-num">06</span>
        <h2 class="section-title">Cuestionario Interactivo</h2>
      </div>
      <div class="quiz-wrap">
        <div id="quizContent">
          <div class="quiz-q" id="quizQuestion"></div>
          <div class="quiz-options" id="quizOptions"></div>
          <div class="quiz-nav">
            <div class="quiz-progress" id="quizProgress">Pregunta 1 / 8</div>
            <div class="quiz-score" id="quizScore">Puntuación: 0</div>
            <button class="btn-primary" style="width:auto;padding:.5rem 1.5rem" onclick="nextQuestion()" id="nextBtn" disabled>Siguiente →</button>
          </div>
        </div>
        <div id="quizResult" style="display:none; text-align:center; padding:2rem">
          <div style="font-family:'Playfair Display',serif; font-size:2.5rem; color:var(--gold);" id="finalScore"></div>
          <p style="color:var(--muted); margin:1rem 0" id="finalMsg"></p>
          <button class="btn-primary" style="width:auto;padding:.7rem 2rem" onclick="resetQuiz()">Reiniciar quiz</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span>∫ CálculoIntegral</span> · Simulador Profesional · 2026 · Desarrollado con HTML, CSS y JavaScript
  </footer>
  <script src="../JavaScript/script.js"></script>
</body>
</html>
